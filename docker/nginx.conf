# nginx-Konfig für Kubernia-Produktions-Image (#752).
# Serviert das statische Vite-Bundle als SPA.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite erzeugt gehashte Dateinamen → lange TTL sicher
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-Fallback: unbekannte Pfade → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
