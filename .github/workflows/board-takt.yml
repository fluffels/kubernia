name: Board-Takt (Status-Ticket, Sammelticket)

# Generischer Board-Takt (#1390, zuvor „Langfuse-Takt“ #1351/#1349, ADR 0016). Statt an einer driftenden Board-Position hängt der Takt
# an der Zeit und an der Aktivität.
# 1. Status-Ticket „Langfuse-Status überprüfen“: montags legt dieser Lauf das Ticket an (wenn seit dem Anlegen des jüngsten Status-Tickets
#    mindestens 5 Commits auf main liegen) bzw. schiebt ein offenes ungeclaimtes an die Spitze des Boards; ein Push auf main tut
#    dasselbe, sobald seit dem Anlegen des jüngsten Status-Tickets mindestens 50 Ticket-Merges (ohne Bots) dazukamen (Fr–So ruht
#    der Push-Auslöser, der Montag setzt zurück; #1628). Angelegt wird nur mit einem
#    Mindestabstand von 24 Stunden zum Abschluss des Vorgängers (#1382).
# 2. Harness-Sammelticket „Harness-Härtung (gesammelt)“: ab 10 Befund-Kommentaren (vertraute Nicht-Bot-Autoren; Härtungs-Takt, Füllstand) holt derselbe Lauf das
#    ungeclaimte hinter den Kopf (#1349, #1888). Außerdem schiebt er es bei jedem Lauf auf die Position laut AGENTS.md zurück, wenn es
#    dahinter steht (Selbstkorrektur, nur nach vorn, nie in den Kopf).
# 3. Tag-Takt (#103): derselbe Lauf zählt die Besitz-PRs seit dem letzten Release-Tag und hält ab 3 PRs, über 7 Tage Alter oder einem
#    Dringlich-Signal genau ein Kopf-Ticket „🏷️ Tag v<x> setzen und syncen“ (scripts/tag-takt.mjs; braucht die volle Historie und lesenden
#    Zugriff auf die Workflow-Läufe für den CI-Status).
# Die Entscheidungen stehen in scripts/board-takt.mjs, scripts/langfuse-takt.mjs und scripts/tag-takt.mjs (pur, getestet, idempotent: kein gespeicherter
# Zähler, jedes Mal aus offenen Issues, Commit-Liste und Board-Liste abgeleitet).
#
# Die Concurrency-Group serialisiert gleichzeitige Auslösungen (Cron + Dispatch): der zweite Lauf wartet und
# sieht dann das Ticket des ersten, legt also nie ein zweites an. Braucht wie die Inbox-Workflows das Secret
# PROJECT_TOKEN (PAT mit project-Scope); fehlt es, wird nur gewarnt.

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: board-takt
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  takt:
    name: "Board-Takt: Status-Ticket und Sammelticket"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Status-Ticket und Harness-Sammelticket pflegen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/board-takt.mjs
      - name: Tag-Ticket pflegen (Tag-Takt)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/tag-takt.mjs
