name: Board-Takt (Status-Ticket, Sammelticket)

# Generischer Board-Takt (#1390, zuvor „Langfuse-Takt“ #1351/#1349, ADR 0016). Statt an einer driftenden Board-Position hängt der Takt
# an der Zeit und an der Aktivität.
# 1. Status-Ticket „Langfuse-Status überprüfen“: montags legt dieser Lauf das Ticket an (wenn seit dem letzten Abschluss
#    mindestens 5 Commits auf main liegen) bzw. schiebt ein offenes ungeclaimtes an die Spitze des Boards; ein Push auf main tut
#    dasselbe, sobald seit dem Anlegen des jüngsten Status-Tickets mindestens 50 Ticket-Merges (ohne Bots) dazukamen (Fr–So ruht
#    der Push-Auslöser, der Montag setzt zurück; #1628). Angelegt wird nur mit einem
#    Mindestabstand von 24 Stunden zum Abschluss des Vorgängers (#1382).
# 2. Harness-Sammelticket „Harness-Härtung (gesammelt)“: nach 3 Spiel-Merges (ohne Issues mit Label `area:harness`) seit dem Abschluss des letzten holt derselbe Lauf das
#    ungeclaimte hinter den Kopf (#1349). Außerdem schiebt er es bei jedem Lauf auf die Position laut AGENTS.md zurück, wenn es
#    dahinter steht (Selbstkorrektur, nur nach vorn, nie in den Kopf).
# Die Entscheidungen stehen in scripts/board-takt.mjs und scripts/langfuse-takt.mjs (pur, getestet, idempotent: kein gespeicherter
# Zähler, jedes Mal aus offenen Issues, Commit-Liste und Board-Liste abgeleitet).
#
# Die Concurrency-Group serialisiert gleichzeitige Auslösungen (Cron + Dispatch): der zweite Lauf wartet und
# sieht dann das Ticket des ersten, legt also nie ein zweites an. Braucht wie die Inbox-Workflows das Secret
# PROJECT_TOKEN (PAT mit project-Scope); fehlt es, wird nur gewarnt.

on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: board-takt
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  takt:
    name: "Board-Takt: Status-Ticket und Sammelticket"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Status-Ticket und Harness-Sammelticket pflegen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/board-takt.mjs
      # Generationsgrenze (ADR 0026): ist das jüngste ungeclaimte Harness-Sammelticket voll (12 offene Zeilen), entsteht der Nachfolger direkt
      # dahinter. Best effort: ein Fehler macht den Takt nicht rot, fehlt der Token, wird nur gewarnt. Scheitert nur die Positionierung des Nachfolgers, bleibt er an Position 4 stehen, bis der Vorgänger geclaimt ist (Selbstkorrektur des Takts).
      - name: Generationsgrenze des Harness-Sammeltickets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PROJECT_TOKEN fehlt: Generationsgrenze übersprungen"
            exit 0
          fi
          node scripts/sammelticket-anlegen.mjs harness --generation
