name: Forum-Eingang

# Flaggt jede neue Forum-Nachricht (GitHub Discussions) automatisch als forum-Issue,
# damit im Board nichts durchrutscht (der /forum-Skill findet sie über das forum-Label). Diese Action ANTWORTET NICHT und legt KEIN echtes
# Bug-/Feature-Ticket an – das ist bewusst der interaktive Teil (siehe /forum-Skill +
# AGENTS.md > Forum-Eingang): die Maintainerin gibt Antwort + Triage frei.
#
# ⚠️ Sicherheit (#531): Discussion-Titel/Body sind UNVERTRAUTER, externer Text und der
# einzige Pfad, auf dem so etwas automatisiert in die Agenten-Arbeitswarteschlange
# gelangt (Prompt-Injection-/Supply-Chain-Fläche). Darum gelangt KEIN Fremdtext in das
# Inbox-Issue: Titel nur der Marker mit Nummer, Body nur Nummer und Links. Den Thread
# liest allein der /forum-Skill über die Quarantäne (Daten, nie Instruktion).
#
# Board-Position (#747): Die Reihenfolge lebt seit #747 in der manuellen Board-Reihenfolge
# (das "nächstes Ticket" ist das oberste freie Item der Board-Liste; das frühere `Prio`-Feld
# ist entfernt). Damit ein frisch geflaggtes Forum-Ticket sofort vorne steht, schiebt diese
# Action das neue Issue per scripts/board-place.mjs --notfall forum --top an die OBERSTE Board-Position
# (mit Wiederholung bei Wettlauf; scheitert es endgültig, wird der Lauf rot, #1628).
# ⚠️ Das braucht einen PAT mit `project`-Scope als Secret PROJECT_TOKEN – das
# Standard-GITHUB_TOKEN kann NICHT in ein User-Project V2 schreiben. Fehlt das Secret,
# wird nur gewarnt (das Inbox-Issue selbst entsteht trotzdem, steht dann irgendwo im Board).
#
# Damit discussion-Trigger feuern, muss diese Datei auf dem Default-Branch (main) liegen.

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    # Eigene Posts/Antworten des Repo-Owners nicht flaggen – sonst löst jede
    # vom /forum-Skill geschriebene Antwort eine neue Inbox aus (Endlosschleife).
    if: github.event.sender.login != github.repository_owner
    steps:
      # Nötig für scripts/board-place.mjs und die Projekt-Config (#1611).
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Inbox-Issue anlegen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISC_NUMBER: ${{ github.event.discussion.number }}
          DISC_URL: ${{ github.event.discussion.html_url }}
          EVENT: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          # Board-Position setzen (#747). Das Standard-GITHUB_TOKEN kann NICHT in ein
          # User-Project V2 schreiben – dafür ein PAT mit project-Scope als Secret
          # PROJECT_TOKEN. Fehlt es, wird nur gewarnt.
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          set -euo pipefail
          marker="Forum #${DISC_NUMBER}:"
          link="${COMMENT_URL:-$DISC_URL}"

          # Gibt es schon ein OFFENES Inbox-Issue für genau diesen Thread?
          # (Titel-Präfix-Match über alle offenen forum-Issues – robuster als die Suche.)
          existing=$(gh issue list --repo "$REPO" --state open --label forum --limit 1000 \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"$marker\"))][0].number // empty")

          if [ -n "$existing" ]; then
            echo "Bestehende Inbox #$existing für $marker – ergänze Kommentar."
            gh issue comment "$existing" --repo "$REPO" \
              --body "🆕 Neue Forum-Aktivität von **${SENDER}** (\`${EVENT}\`): ${link}"
          else
            echo "Lege neue Inbox für $marker an."
            body=$(printf '%s\n' \
              "Automatisch aus dem Forum (GitHub Discussions) angelegt. **Noch nicht beantwortet.**" \
              "" \
              "Discussion #${DISC_NUMBER} (der Inhalt steht bewusst nicht hier: öffentliche Fremddaten, nur über den \`/forum\`-Skill und die Quarantäne lesen)." \
              "" \
              "- Thread: ${DISC_URL}" \
              "- Letzte Aktivität: **${SENDER}** (\`${EVENT}\`) → ${link}" \
              "" \
              "➡️ Mit dem \`/forum\`-Skill bearbeiten: Nachricht lesen → Antwort entwerfen (Formulierung von der Maintainerin freigeben lassen) → unter der gesetzten gh-Identität posten → passendes Ticket anlegen/zuordnen → dieses Issue schließen. Details in AGENTS.md › Forum-Eingang.")
            new_url=$(gh issue create --repo "$REPO" \
              --title "${marker} neue Nachricht" \
              --label "forum" \
              --body "$body")
            echo "Angelegt: ${new_url}"
            # An die oberste Board-Position schieben (#747) – nur beim NEUEN Issue, nicht beim Ergänzen eines bestehenden.
            # board-place.mjs wiederholt den Wettlauf (frisches Issue ohne GraphQL-Node) mit Pause; scheitert es endgültig, wird der Lauf rot (#1628).
            nr="${new_url##*/}"
            if [ -z "${PROJECT_TOKEN:-}" ]; then
              echo "::warning::PROJECT_TOKEN-Secret fehlt – Board-Position für #${nr} nicht gesetzt (Issue steht dann irgendwo statt oben). PAT mit project-Scope als Secret PROJECT_TOKEN hinterlegen."
            elif ! GH_TOKEN="$PROJECT_TOKEN" node scripts/board-place.mjs --notfall forum --top "$nr"; then
              echo "::error::Board-Position für #${nr} nicht gesetzt – board-place.mjs ist endgültig gescheitert (Token-Scope: Issues-Zugriff auf ${REPO} UND Projects-Schreibrecht, #950)."
              exit 1
            fi
          fi
