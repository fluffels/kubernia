name: CodeQL

# #875: Statische Code-Analyse (SAST) als Advanced-Setup, versioniert und reviewbar (kein Default-Setup in den
# Repo-Einstellungen). BERICHTEND, kein Required-Check: Funde landen im Security-Tab (Code-Scanning), der Lauf sperrt
# den Merge nicht. `scripts/pr-warten.mjs` meldet ein Rot dieses Workflows nur als HINWEIS (es ist kein Pflicht-Check).
# Der Jobname beschattet nie einen Required-Check (Wächter: required-check-shadowing-projekt.test.ts).
# Schreibrecht `security-events` hat nur der Analyse-Job (SARIF-Upload); alle Actions sind per Commit-SHA gepinnt.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyse:
    name: CodeQL-Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: CodeQL analysieren und Ergebnisse hochladen
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
