name: Audit-Einordnung

# Täglicher Lauf (#1628): wertet den vollen `npm audit` (inkl. Dev) und die offenen Dependabot-Alerts aus. Je neuem Advisory
# (Dedupe über die GHSA-ID) entsteht eine Zeile im jüngsten ungeclaimten Harness-Sammelticket; nur bei critical UND ausgelieferter
# Produktiv-Abhängigkeit ein Ticket "🔒 Security: …" ganz oben im Board. Mechanik: docs/ticket-reihenfolge.md › Audit-Einordnung.
# Ergänzt die Stufe 2 des Jobs security-audit in ci.yml (nur Bericht), die nirgends landet.
#
# ⚠️ Das Board braucht wie dependabot-inbox.yml das Secret PROJECT_TOKEN (PAT mit project-Scope); ohne Token nur eine Warnung zum Alarm.
# Kommentare postet github-actions[bot] (in scripts/fremdtext-lib.mjs vertraut, sonst blendet scripts/fremdtext.mjs die Zeilen aus).
# Alle Actions sind per Commit-SHA gepinnt (Wächter: test/harness/sicherheits-workflows.test.ts).

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch: {}

concurrency: audit-einordnung

permissions: {}

jobs:
  audit-einordnung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      # `npm audit` liest nur den Lockfile, kein npm ci nötig.
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit einordnen
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: node scripts/audit-einordnung.mjs
