name: CI

# Qualitätstore bei jedem Push auf main und bei jedem Pull Request.
# Hält main grün: Tests + Typecheck + beide Builds müssen durchlaufen.
# workflow_dispatch erlaubt zusätzlich den manuellen Start – v.a. um den
# Dev-Panel-Build (#331) zwischendurch anzustoßen und das Artefakt zu ziehen.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Veraltete Runs desselben Branches/PRs abbrechen, sobald ein neuer startet.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Tests, Typecheck & Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # #592: volle Historie, damit check:diffsize (#533) den PR-Slice WIRKLICH
          # gegen die PR-Basis messen kann. Ohne Historie (Default fetch-depth 1)
          # fehlt die Vergleichs-Basis und der Wächter degradiert zu Grün — genau
          # die Lücke, die #592 serverseitig (als Required Check auf PRs) schließt.
          fetch-depth: 0

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      # #527: alle Gates laufen über EINE SSOT-Kette (npm run verify) statt hier
      # als sechs einzeln duplizierte Steps. So kann die lokale Reihenfolge nicht
      # von der CI driften und kein Gate wird beim lokalen Lauf vergessen. Die
      # Kette ist: typecheck → lint → check:arch → check:size → check:docmap →
      # check:docdrift → check:diffsize → test (billige Gates fail-fast zuerst,
      # die volle Test-Suite zuletzt). Builds + Boot-Smoke bleiben eigene Steps,
      # weil sie Artefakte hochladen (= CI-Sache); zusammen = `npm run verify:full`.
      # Hinweis: check:diffsize (#533) misst den Slice gegen die Basis. Auf einem PR
      # (fetch-depth:0 oben) ist die Basis die PR-Basis — via KQ_DIFF_BASE gesetzt —,
      # der Wächter greift hier also WIRKLICH als Required Check (#592). Auf dem
      # push-auf-main-Event (nach dem Merge) ist die Basis der Vorgänger-Commit
      # (github.event.before) → der Wächter misst den gerade gemergten Slice AUCH
      # auf main nach, statt dort zu Grün zu degradieren (#605, zweite Grenze hinter
      # dem PR-Gate). Ein roter main-Lauf blockiert nichts (main ist schon gepusht),
      # löst aber den Alarm-Job unten aus.
      - name: Verify – alle Gates in einer SSOT-Kette (#527)
        env:
          # PR → die PR-Basis: check:diffsize misst genau den PR-Slice (#592).
          # push:main → der Vorgänger-Commit: diffsize misst den gemergten Slice
          # nach (#605). Bei workflow_dispatch sind beide leer → interne
          # origin/main-Auflösung (auf main == HEAD → No-op-grün).
          KQ_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify

      # Coverage-Gate (#495): eigener Schritt, weil die v8-Instrumentierung die Test-Suite
      # spürbar verlangsamt (~+6 s) — die schnelle `verify`/pre-push-Kette bleibt darum
      # uninstrumentiert. `test:coverage` misst pro Schicht-Bucket (Domäne/Anwendung hart,
      # Präsentation explizit niedrig, siehe vite.config.ts) und bricht bei Unterschreiten
      # der Floors ab; verhindert, dass eine Domänen-Regression hinter dem Repo-Mittel
      # untergeht. Lokal Teil von `npm run verify:full`.
      - name: Coverage-Gate – pro Schicht (#495)
        run: npm run test:coverage

      - name: Host-Build
        run: npm run build

      - name: Offline-Build
        run: npm run build:offline

      # Bundle-Budget-Gate (#503): jetzt liegen beide Builds vor — hartes Byte-Budget
      # für die ausgelieferten Artefakte (Offline-HTML + Spielcode-Chunks ohne Phaser).
      # Bewusst HIER, nach den Builds (nicht in der build-freien `verify`-Kette), analog
      # zu verify:full. Macht die reine chunkSizeWarningLimit-Warnung zu einem echten Fail.
      - name: Bundle-Budget-Gate (nach den Builds, #503)
        run: npm run check:bundle

      - name: Offline-Build als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: kubernia-offline
          path: dist-offline/index.html
          if-no-files-found: error

      # Boot-Smoke-Test (#391): die Builds oben werden gebaut, aber nie GESTARTET.
      # Unit-Tests fassen die Präsentation (Phaser/DOM) bewusst nicht an, also
      # käme ein erst beim echten Boot auftretender Fehler (Phaser-Init, Content-
      # Loader wirft, kaputtes Asset-Manifest) durch. Wir laden den eben gebauten
      # Offline-Build headless in Chromium und prüfen, dass er ohne Konsolen-/
      # Laufzeit-Fehler hochfährt (dist-offline/index.html ist hier schon da).
      - name: Playwright-Browser installieren (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Boot-Smoke-Test (headless, #391)
        run: npm run test:smoke

      - name: Smoke-Test-Trace bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kubernia-smoke-trace
          path: test-results/
          if-no-files-found: ignore

  # Security-Audit (#396): npm audit als CI-Gate. Bewusst ZWEISTUFIG, um die
  # ⚠️-Falle aus dem Ticket zu vermeiden – ein hartes high+-Gate über den GANZEN
  # Baum wäre durch die dev-only-Advisories aus #395 (vite high, vitest critical)
  # dauerhaft rot und würde damit nur abgeschaltet/ignoriert:
  #   1) BLOCKIEREND nur über die ausgelieferten Produktiv-Deps (--omit=dev). Das
  #      ist das echte Nutzerrisiko – im dist-Artefakt steckt nur phaser & Co.,
  #      kein vite/vitest. Selbstwartend: kein hartcodierter Advisory-Allowlist,
  #      der bei Stardew-Scope verrottet.
  #   2) NUR BERICHT über den vollen Baum (inkl. Dev): macht Dev-Advisories
  #      sichtbar, hält den Build aber nicht rot. Dev-Findings greift zusätzlich
  #      Dependabot als Security-PR auf (.github/dependabot.yml).
  # npm audit liest den Lockfile direkt – kein `npm ci`/node_modules nötig.
  security-audit:
    name: Security-Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit der Produktiv-Deps (blockt bei high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit aller Deps inkl. Dev (nur Bericht, blockt nicht)
        if: always()
        continue-on-error: true
        run: npm audit

  # Doku-Aktualitäts-Wächter (#610): gleicht die in docs/agent-harness.md als
  # „offen" markierten Roadmap-Tickets gegen den echten gh-issue-Status ab und
  # ALARMIERT, wenn ein längst geschlossenes Ticket noch als offen dokumentiert ist
  # (der reale #492-Befund). BEWUSST NICHT in der hermetischen `verify`-Kette: der
  # gh-Abgleich braucht Netz + Token und ist nicht deterministisch. Eigener Job,
  # gh ist auf ubuntu-Runnern vorinstalliert, Token = GITHUB_TOKEN (Issue-Lesezugriff).
  # continue-on-error: NON-BLOCKING — ein von einem parallelen Agenten geschlossenes
  # Roadmap-Ticket soll keinen fremden PR rot-blocken (⚠️-Anti-Pattern #395); der rote
  # Schritt bleibt aber als Alarm sichtbar. Kein npm ci nötig (nur Node-Builtins + gh).
  doc-freshness:
    name: Doku-Aktualität (Roadmap-Tickets, #610)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Offen-markierte Roadmap-Tickets gegen gh-Status prüfen (#610)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-doc-tickets.mjs

  # Duplikations-Report (#612): jscpd als WEICHES, NICHT-BLOCKIERENDES CI-Artefakt.
  # Hintergrund (iSAQB-Runde 3, docs/architektur-analyse-2026-07-03-iSAQB.md): die
  # SSOT-Umgehungen (#534/#577/#578, _resetNodes/#596) sind die einzige Regressionsklasse
  # OHNE direkten Guard — sie hängen nur am Invariant (der erst bei illegalem State wirft)
  # plus Review; einen Copy-Paste-Detektor gab es nicht. jscpd macht eine Copy-Paste-
  # Wiedereinführung früh sichtbar. BEWUSST WEICH (kein Gate, analog zum nur-berichtenden
  # dev-`npm audit` oben): harte Duplikat-Schwellen erzeugen viele False Positives und
  # würden — wie das dev-Audit aus #395 — sonst nur abgeschaltet/ignoriert. Darum kein
  # `threshold` in .jscpd.json (jscpd exit 0 unabhängig von der Duplikatquote) UND
  # continue-on-error als zweiter Riegel; der HTML/JSON-Report wird nur als Artefakt
  # hochgeladen. Bewusst NICHT Teil von `npm run verify(:full)` (den blockierenden
  # Gate-Ketten) und ein eigener Job, damit er build-test nie rot färbt.
  duplication-report:
    name: Duplikations-Report (jscpd, nicht-blockierend, #612)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: jscpd-Duplikations-Report (nur Bericht, blockt nicht)
        continue-on-error: true
        run: npm run check:duplication

      - name: Duplikations-Report als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kubernia-duplication-report
          path: jscpd-report/
          if-no-files-found: warn

  # Dev-Panel-Build (#331): liefert das sonst dev-server-only Panel als eine
  # self-contained Datei aus, passwortgated über das Repo-Secret VITE_KQ_DEVPANEL_PW.
  # WICHTIG (Geheimhaltung): nur bei Push auf main bzw. manuellem Start – NICHT bei
  # pull_request, damit das Secret nie an (Fork-)PRs gerät. GitHub liefert Secrets
  # ohnehin nicht an Fork-PRs aus; das if ist der zusätzliche, explizite Riegel.
  devpanel-build:
    name: Dev-Panel-Build (passwortgated, nur main/manuell)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Dev-Panel-Build (Single-File, Passwort aus Secret injiziert)
        run: npm run build:devpanel
        env:
          # Wert steht NICHT im Repo – kommt aus dem Repo-Secret. Fehlt das Secret,
          # baut es trotzdem durch; das Panel bleibt dann nur gesperrt.
          VITE_KQ_DEVPANEL_PW: ${{ secrets.VITE_KQ_DEVPANEL_PW }}

      - name: Dev-Panel-Build als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: kubernia-devpanel
          path: dist-devpanel/index.html
          if-no-files-found: error

  # Post-hoc-Alarm (#605): die ZWEITE Grenze hinter dem PR-Gate (#592). `main` ist
  # seit #592 PR-gegated, aber ein roter `main` TROTZ grüner PR-Checks bleibt möglich
  # — ein semantischer Merge-Konflikt zweier je grüner PRs, ein fehlkonfigurierter
  # Required Check, ein Admin-/Force-Push. Ein rotes ✗ an einem Commit übersieht ein
  # paralleler Agent leicht; die Board-SSOT ist ein OFFENES Issue. Dieser Job fährt
  # NICHTS neu nach (build-test fährt die volle verify-Kette auf push:main schon,
  # inkl. diffsize gegen den Vorgänger, s.o.) — er schlägt nur Alarm, wenn dieser
  # Lauf auf main rot war: er öffnet ein Alarm-Issue (dedupliziert — ein offenes
  # Alarm-Issue zur Zeit) und blockiert bewusst NICHTS (main ist ohnehin schon
  # gepusht; kein Bruch des Workflows, genau wie das Ticket es fordert).
  # Nur auf push (= main): ein roter PR ist erwartbar und Sache der PR-Autorin,
  # kein Board-Alarm.
  #
  # Priorisierung über die Board-Position (#658/#747): Seit #627 sind die `prio:*`-Labels
  # entfernt, seit #747 ist auch das Board-`Prio`-Feld weg — die Reihenfolge ist die
  # manuelle Board-Position (oberstes freies Item = dran). Also wie in forum-inbox.yml:
  # Issue mit einem existierenden Label (`area:architektur`) anlegen und per GraphQL an
  # die OBERSTE Board-Position schieben (ein roter `main` blockiert jeden parallelen
  # Agenten → höchste Dringlichkeit). Dedup läuft über den Titel-Präfix, nicht über ein
  # Label. Board-Schreibzugriff braucht das Secret PROJECT_TOKEN (das Standard-
  # GITHUB_TOKEN kann kein User-Project V2 schreiben); fehlt es, entsteht das Issue
  # trotzdem und steht nur nicht garantiert oben.
  alarm-red-main:
    name: Alarm bei rotem main (#605)
    needs: [build-test, security-audit]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Alarm-Issue öffnen oder ergänzen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          # Board-Position setzen (#658/#747, analog forum-inbox.yml). Das Standard-
          # GITHUB_TOKEN kann NICHT in ein User-Project V2 schreiben – dafür ein PAT mit
          # project-Scope als Secret PROJECT_TOKEN. Fehlt es, wird nur gewarnt (siehe set_board_top unten).
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Node-ID des Kubernia-Backlog-Boards (stabil,
          # siehe docs/ticket-reihenfolge.md › Reihenfolge pflegen).
          PROJECT_ID: PVT_kwHOD8746c4Barq_
          # Existierendes Label (die prio:*-Labels sind seit #627 entfernt, #658).
          ALARM_LABEL: area:architektur
        run: |
          set -euo pipefail
          marker="🚨 CI rot auf main"
          short="${SHA:0:7}"

          # Schiebt das frisch angelegte Alarm-Issue an die OBERSTE Board-Position (#747),
          # statt sich auf ein entferntes Prio-Feld/Label zu verlassen.
          # addProjectV2ItemById ist idempotent: ist das Issue schon per Board-„Auto-add"
          # drauf, kommt einfach die bestehende Item-ID zurück – der async-Race ist damit
          # egal. updateProjectV2ItemPosition ohne afterId = ganz oben.
          set_board_top() {
            local issue_url="$1"
            if [ -z "${PROJECT_TOKEN:-}" ]; then
              echo "::warning::PROJECT_TOKEN-Secret fehlt – Board-Position für ${issue_url} nicht gesetzt (Alarm-Issue steht dann irgendwo statt oben). PAT mit project-Scope als Secret PROJECT_TOKEN hinterlegen."
              return 0
            fi
            local content_id
            content_id=$(gh issue view "$issue_url" --repo "$REPO" --json id --jq .id)
            local item_id
            item_id=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
              -f query='mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
              -f p="$PROJECT_ID" -f c="$content_id" \
              --jq '.data.addProjectV2ItemById.item.id')
            GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
              -f query='mutation($p:ID!,$i:ID!){ updateProjectV2ItemPosition(input:{projectId:$p,itemId:$i}){ items(first:1){ nodes{ id } } } }' \
              -f p="$PROJECT_ID" -f i="$item_id" >/dev/null
            echo "Board-Position 'oben' gesetzt für ${issue_url} (item ${item_id})."
          }

          # Gibt es schon ein OFFENES Alarm-Issue? (Titel-Präfix-Match über die offenen
          # area:architektur-Issues — dasselbe robuste Muster wie forum-inbox.yml; kein
          # prio:hoch-Label mehr, das gibt es seit #627 nicht.) Solange main rot bleibt,
          # hängen weitere rote Läufe nur einen Kommentar an, statt zu spammen.
          existing=$(gh issue list --repo "$REPO" --state open --label "$ALARM_LABEL" \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"$marker\"))][0].number // empty")

          if [ -n "$existing" ]; then
            echo "Bestehendes Alarm-Issue #$existing – ergänze Kommentar."
            gh issue comment "$existing" --repo "$REPO" \
              --body "🔴 Erneut rot auf \`main\` bei Commit [\`${short}\`](${COMMIT_URL}) → [CI-Lauf](${RUN_URL})."
          else
            echo "Lege neues Alarm-Issue an."
            body=$(printf '%s\n' \
              "Der CI-Lauf auf \`main\` ist **rot** — obwohl \`main\` seit #592 PR-gegated ist. Das ist die zweite Grenze aus #605: ein roter \`main\` trotz grüner PR-Checks (semantischer Merge zweier je grüner PRs, ein fehlkonfigurierter Required Check, ein Admin-/Force-Push)." \
              "" \
              "- Commit: [\`${short}\`](${COMMIT_URL})" \
              "- Fehlgeschlagener Lauf: ${RUN_URL}" \
              "" \
              "**Zuerst behandeln** (main muss grün sein, bevor ein paralleler Agent darauf aufbaut): Ursache im Lauf ansehen → auf einem Fix-Branch reparieren → per PR mergen → dieses Issue schließen. Solange main rot bleibt, hängt jeder weitere rote Lauf nur einen Kommentar hier an (kein Issue-Spam).")
            new_url=$(gh issue create --repo "$REPO" \
              --title "${marker} (${short})" \
              --label "$ALARM_LABEL" \
              --body "$body")
            echo "Angelegt: ${new_url}"
            # An die oberste Board-Position schieben (#747) – nur beim NEUEN Issue, nicht
            # beim Ergänzen eines bestehenden (das steht schon an seiner Board-Position).
            set_board_top "$new_url"
          fi
