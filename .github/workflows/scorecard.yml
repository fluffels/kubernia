name: Scorecard

# #875: OpenSSF Scorecard prüft die Sicherheits-Haltung des Repos (Pinned-Dependencies, Token-Permissions, Branch-Schutz …).
# BERICHTEND, kein Required-Check: das SARIF geht in den Security-Tab. Ohne Veröffentlichung an die OpenSSF-API
# (`publish_results: false`), ohne PAT (`repo_token`) und ohne `id-token`; läuft nie auf PRs.
# Wächter: test/harness/sicherheits-workflows.test.ts.

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analyse:
    name: Scorecard-Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scorecard ausführen
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Ergebnisse in den Security-Tab hochladen
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
