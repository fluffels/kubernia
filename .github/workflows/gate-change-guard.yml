name: Gate-Change-Guard

# Eigener, schlanker Workflow NUR fuer den Goodhart-/Harness-Freigabe-Guard (#1015).
# Bewusst aus ci.yml ausgelagert: er triggert zusaetzlich auf `labeled`/`unlabeled`,
# damit das Setzen von `maintainer-approved` den Required-Check automatisch neu laufen
# laesst (vorher blieb er nach dem Label rot haengen und musste von Hand neu gestartet
# werden). Die teuren Jobs in ci.yml (Tests/Builds/Gates) laufen so NICHT bei jeder
# Label-Aenderung neu — nur dieser kurze Guard.
#
# ⚠️ Job-Key UND `name:` unten sind wortgleich aus ci.yml uebernommen — der
# Required-Check-Kontext im Ruleset `main-schutz` haengt am Job-Namen. YAML schneidet
# den unquoteten Namen bewusst an ` #903` ab (offenes Ticket #984); NICHT quoten/aendern,
# sonst bricht der Required-Check-Kontext (dann muss das Ruleset nachgezogen werden, #984).
#
# ⚠️ Fuer den PR, der diese Datei EINFUEHRT, greift der labeled-Trigger erst nach dem
# Merge auf main zuverlaessig — dieser eine PR braucht ggf. noch einen manuellen Re-run
# des Guards nach dem Label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Veraltete Runs desselben PRs abbrechen, sobald ein neuer startet.
concurrency:
  group: gate-change-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Goodhart-Guard (#903, erweitert #1012): deterministischer Sign-off-Zwang für PRs, die
  # Gate-/Fitness-Function-Konfiguration ODER Harness-/Leitplanken-Dateien ändern (AGENTS.md,
  # CLAUDE.md, .claude/, .agents/, Harness-Doku). Zwei Gründe, eine Pflicht: Gate-Aufweichen
  # (Goodhart) bzw. Selbstmodifikation der Leitplanken (#1012 — „am Harness darf die KI nicht
  # komplett allein"). CODEOWNERS + require_code_owner_reviews ist im Single-Account-Modell
  # (@fluffels ist Autor UND einziger Codeowner gleichzeitig) empirisch wirkungslos — GitHub
  # lässt die Review-Anforderung ersatzlos fallen (mergeStateStatus=CLEAN ohne jede Freigabe).
  # Dieser Job ersetzt den technischen Zwang: Findet er Änderungen an den geschützten Pfaden
  # (SSOT .github/protected-paths.json, #1157), prüft er, ob das Label 'maintainer-approved' gesetzt ist
  # — ohne es bleibt der Check ROT.
  #
  # Ehrliche Einschränkung: im Single-Account-Modell kann @fluffels das Label selbst setzen
  # — einen kryptographisch-unabhängigen Approver gibt es nicht (bewusst verworfen, #723).
  # Der Guard ist ein SPEED-BUMP: er erzwingt eine explizite, sichtbare Zusatz-Aktion statt
  # stillschweigend durchzumergen, und macht Gate-Abschwächungen damit im PR-Log auditierbar.
  # Nur auf PRs (push:main hat kein Label-Konzept; wäre nach dem Merge ohnehin zu spät).
  gate-change-guard:
    name: Gate-Config-Aenderungsschutz (Goodhart-Guard, #903)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gate-Dateien pruefen + Sign-off-Label erzwingen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Geschuetzte Pfade — SSOT ist .github/protected-paths.json (#1157), keine eigene
          # Liste mehr. jq bringt die CODEOWNERS-Schreibweise in die Substring-Form: fuehrenden
          # '/' weg, ab dem ersten '*' abschneiden ("/scripts/check-*.mjs" -> "scripts/check-")
          # — dieselbe Abbildung wie normalizeProtected in test/harness-approval.test.ts.
          #
          # Gelesen vom BASE-Commit, nicht aus der Arbeitskopie: der Checkout ist der
          # PR-Merge-Ref, ein PR koennte die Quelle sonst leeren und sich damit selbst
          # entschuetzen. (Aendert ein PR diesen Workflow selbst, laeuft dessen Fassung — das
          # bleibt, wie der ganze Guard, ein Speed-Bump; darum ist .github/workflows/ geschuetzt.) Die Head-Fassung kommt nur ADDITIV dazu, damit ein neu ergaenzter
          # Pfad schon im einfuehrenden PR greift. Fail-closed: fehlt die Base-Quelle oder ist
          # sie leer/kaputt, gilt JEDE geaenderte Datei als geschuetzt (Label-Pflicht).
          QUELLE=.github/protected-paths.json
          JQ_PFADE='[.[]] | flatten | .[] | sub("^/"; "") | sub("\\*.*$"; "")'
          alles_geschuetzt=0
          if ! base_pfade=$(git show "$BASE_SHA:$QUELLE" 2>/dev/null | jq -r "$JQ_PFADE") || [ -z "$base_pfade" ]; then
            echo "::warning::$QUELLE auf dem Base-Commit fehlt oder ist unlesbar — jede geaenderte Datei gilt als geschuetzt."
            alles_geschuetzt=1
            base_pfade=""
          fi
          head_pfade=$(git show "$HEAD_SHA:$QUELLE" 2>/dev/null | jq -r "$JQ_PFADE" 2>/dev/null || true)
          mapfile -t PROTECTED < <(printf '%s\n%s\n' "$base_pfade" "$head_pfade" | grep -v '^$' | sort -u || true)

          # Drei-Punkt-Diff (#1095): nur was der PR seit der Merge-Base aendert. Der
          # Zwei-Punkt-Diff gegen base.sha (= main-Tip) zaehlte Dateien fremder, nach dem
          # Abzweigen gemergter main-Commits mit (PR #1093). fetch-depth: 0 oben liefert
          # die Historie fuer die Merge-Base; bewacht von test/harness-approval.test.ts.
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          gate_files=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$alles_geschuetzt" = 1 ]; then
              gate_files+=("$f")
              continue
            fi
            for pat in "${PROTECTED[@]}"; do
              if [[ "$f" == *"$pat"* ]]; then
                gate_files+=("$f")
                break
              fi
            done
          done <<< "$changed"

          if [ ${#gate_files[@]} -eq 0 ]; then
            echo "Keine Gate-Config-Dateien geaendert — kein Sign-off noetig."
            exit 0
          fi

          echo "Gate-Config-Dateien in diesem PR:"
          printf '  %s\n' "${gate_files[@]}"
          echo ""

          has_label=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels \
            --jq '[.labels[].name] | any(. == "maintainer-approved")')

          if [ "$has_label" = "true" ]; then
            echo "Label 'maintainer-approved' gefunden — Sign-off OK."
            exit 0
          fi

          echo "::error title=Gate-/Harness-Aenderung ohne Sign-off::Dieser PR aendert Gate-Config oder Harness-/Leitplanken-Dateien (${gate_files[*]}). Label 'maintainer-approved' fehlt."
          echo "::error::Losung: gh pr edit $PR_NUMBER --add-label maintainer-approved (oder ueber die GitHub-UI)."
          echo "::error::Warum: Gate-Config aendern kann ein Gate unbemerkt abschwaechen (Goodhart, #903); Harness-/Leitplanken-Dateien sind Selbstmodifikation (#1012). Seit #1069 darf der Agent das Label bei der INTENDIERTEN Aenderung seines Tickets selbst setzen (danach Audit-Kommentar auf dem PR) — nie als Workaround, um ein Gate gruen zu bekommen."
          exit 1
