name: Dependabot-Inbox

# Sammelt offene Dependabot-PRs automatisch in EINEM Board-Ticket an der obersten
# Board-Position (#712/#747), damit sie beim "nächstes Ticket"-Griff
# (docs/ticket-reihenfolge.md: oberstes freies Item der Board-Reihenfolge) ganz oben
# stehen, statt nur aufzufallen, wenn jemand explizit danach fragt.
#
# Dedupliziert über den Titel-Präfix "🤖 Dependabot-PRs auflösen" (dasselbe Muster
# wie forum-inbox.yml und der alarm-red-main-Job in ci.yml): existiert das
# Sammel-Issue schon, wird nur der PR-Stand per Kommentar aktualisiert statt ein
# zweites Issue anzulegen. Sind KEINE Dependabot-PRs mehr offen, wird ein noch
# offenes Sammel-Issue automatisch geschlossen (kein vergessenes Ticket ohne Grund).
#
# ⚠️ Braucht dasselbe Secret PROJECT_TOKEN (PAT mit project-Scope) wie forum-inbox.yml
# – das Standard-GITHUB_TOKEN kann kein User-Project V2 beschreiben. Fehlt es, wird
# nur gewarnt (das Sammel-Issue entsteht trotzdem, steht dann irgendwo im Board).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      # Volles Repo und Node für scripts/board-place.mjs (Board-Position mit Wiederholung, #1628); kein npm ci nötig.
      # Das Label kommt aus der Projekt-Config; ohne Checkout gäbe es keines, darum bricht ein gescheiterter Schritt den Lauf sichtbar rot ab.
      - name: Repo auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Label der Sammel-Issues aus der Projekt-Config lesen
        id: label
        env:
          REPO: ${{ github.repository }}
        run: |
          if ! wert=$(node scripts/projekt-config.mjs labels.dependabotInbox); then
            echo "::error::labels.dependabotInbox fehlt oder .factory/projekt.json ist ungültig (Fix: Schlüssel in .factory/projekt.json eintragen)"
            exit 1
          fi
          # Ziel-Repo (#76): ein Label, dessen Issues ein anderes Repo führt (Harness-Label bei fremdem Factory-Board), würde hier im
          # eigenen Repo angelegt und dann am Board-Guard scheitern: vor dem Anlegen klar abbrechen, nie still im eigenen Repo anlegen.
          if ! ziel=$(node scripts/projekt-config.mjs --ziel-repo "$wert"); then
            echo "::error::Ziel-Repo zu labels.dependabotInbox nicht bestimmbar (Fix: .factory/projekt.json prüfen)"
            exit 1
          fi
          if [ "${ziel,,}" != "${REPO,,}" ]; then
            echo "::error::labels.dependabotInbox ($wert) gehört zu $ziel, nicht zu $REPO: das Sammel-Issue entstünde im falschen Repo (Fix: labels.dependabotInbox auf ein Label des eigenen Boards setzen)"
            exit 1
          fi
          echo "wert=$wert" >> "$GITHUB_OUTPUT"

      - name: Sammel-Issue anlegen, aktualisieren oder schließen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Board-Position setzen (#712/#747, analog forum-inbox.yml). Das Standard-
          # GITHUB_TOKEN kann NICHT in ein User-Project V2 schreiben – dafür ein PAT mit
          # project-Scope als Secret PROJECT_TOKEN. Fehlt es, wird nur gewarnt.
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          INBOX_LABEL: ${{ steps.label.outputs.wert }}
        run: |
          set -euo pipefail
          marker="🤖 Dependabot-PRs auflösen"

          count=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" --limit 1000 --json number --jq 'length')

          # Gibt es schon ein OFFENES Sammel-Issue? (Titel-Exakt-Match über die offenen
          # Issues mit dem Label der Config — dasselbe robuste Muster wie forum-inbox.yml.)
          existing=$(gh issue list --repo "$REPO" --state open --label "$INBOX_LABEL" --limit 1000 \
            --json number,title \
            --jq "[.[] | select(.title == \"$marker\")][0].number // empty")

          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              echo "Keine offenen Dependabot-PRs mehr – schließe Sammel-Issue #$existing."
              gh issue close "$existing" --repo "$REPO" --reason completed \
                --comment "Keine offenen Dependabot-PRs mehr – automatisch geschlossen."
            else
              echo "Keine offenen Dependabot-PRs, kein Sammel-Issue nötig."
            fi
            exit 0
          fi

          list=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" --limit 1000 --json number,title,url \
            --jq '.[] | "- #\(.number) \(.title) (\(.url))"')

          if [ -n "$existing" ]; then
            echo "Bestehendes Sammel-Issue #$existing – aktualisiere PR-Liste per Kommentar."
            gh issue comment "$existing" --repo "$REPO" \
              --body "$(printf 'Aktueller Stand: %s offene Dependabot-PR(s).\n\n%s' "$count" "$list")"
          else
            echo "Lege neues Sammel-Issue an."
            body=$(printf '%s\n' \
              "Automatisch angelegt: **${count} offene Dependabot-PR(s)** warten auf Merge." \
              "" \
              "$list" \
              "" \
              "**Abarbeiten ohne Worktree/Code** (wie der Epic-Sonderfall, siehe AGENTS.md › Der Agent managt das Board): pro PR CI grün prüfen (\`gh pr checks <nr>\`) und mergen (\`gh pr merge <nr> --squash --delete-branch\`), danach dieses Issue schließen (\`gh issue close <nr> --reason completed\`).")
            new_url=$(gh issue create --repo "$REPO" \
              --title "$marker" \
              --label "$INBOX_LABEL" \
              --body "$body")
            echo "Angelegt: ${new_url}"
            # An die oberste Board-Position schieben (#747) – nur beim NEUEN Issue, nicht beim Ergänzen eines bestehenden.
            # board-place.mjs wiederholt den Wettlauf (frisches Issue ohne GraphQL-Node) mit Pause; scheitert es endgültig, wird der Lauf rot (#1628).
            nr="${new_url##*/}"
            if [ -z "${PROJECT_TOKEN:-}" ]; then
              echo "::warning::PROJECT_TOKEN-Secret fehlt – Board-Position für #${nr} nicht gesetzt (Sammel-Issue steht dann irgendwo statt oben). PAT mit project-Scope als Secret PROJECT_TOKEN hinterlegen."
            elif ! GH_TOKEN="$PROJECT_TOKEN" node scripts/board-place.mjs --notfall dependabot --top "$nr"; then
              echo "::error::Board-Position für #${nr} nicht gesetzt – board-place.mjs ist endgültig gescheitert (Token-Scope: Issues-Zugriff auf ${REPO} UND Projects-Schreibrecht, #950)."
              exit 1
            fi
          fi
