name: Dependabot-Inbox

# Sammelt offene Dependabot-PRs automatisch in EINEM Board-Ticket an der obersten
# Board-Position (#712/#747), damit sie beim "nächstes Ticket"-Griff
# (docs/ticket-reihenfolge.md: oberstes freies Item der Board-Reihenfolge) ganz oben
# stehen, statt nur aufzufallen, wenn jemand explizit danach fragt.
#
# Dedupliziert über den Titel-Präfix "🤖 Dependabot-PRs auflösen" (dasselbe Muster
# wie forum-inbox.yml und der alarm-red-main-Job in ci.yml): existiert das
# Sammel-Issue schon, wird nur der PR-Stand per Kommentar aktualisiert statt ein
# zweites Issue anzulegen. Sind KEINE Dependabot-PRs mehr offen, wird ein noch
# offenes Sammel-Issue automatisch geschlossen (kein vergessenes Ticket ohne Grund).
#
# ⚠️ Braucht dasselbe Secret PROJECT_TOKEN (PAT mit project-Scope) wie forum-inbox.yml
# – das Standard-GITHUB_TOKEN kann kein User-Project V2 beschreiben. Fehlt es, wird
# nur gewarnt (das Sammel-Issue entsteht trotzdem, steht dann irgendwo im Board).

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Sammel-Issue anlegen, aktualisieren oder schließen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Board-Position setzen (#712/#747, analog forum-inbox.yml). Das Standard-
          # GITHUB_TOKEN kann NICHT in ein User-Project V2 schreiben – dafür ein PAT mit
          # project-Scope als Secret PROJECT_TOKEN. Fehlt es, wird nur gewarnt (siehe set_board_top).
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          # Node-ID des Kubernia-Backlog-Boards (stabil,
          # siehe docs/ticket-reihenfolge.md › Reihenfolge pflegen).
          PROJECT_ID: PVT_kwHOD8746c4Barq_
          INBOX_LABEL: area:architektur
        run: |
          set -euo pipefail
          marker="🤖 Dependabot-PRs auflösen"

          # Schiebt das frisch angelegte Sammel-Issue an die OBERSTE Board-Position (#747).
          # addProjectV2ItemById ist idempotent: ist das Issue schon per Board-„Auto-add"
          # drauf, kommt einfach die bestehende Item-ID zurück – der async-Race ist damit
          # egal. updateProjectV2ItemPosition ohne afterId = ganz oben.
          set_board_top() {
            local issue_url="$1"
            if [ -z "${PROJECT_TOKEN:-}" ]; then
              echo "::warning::PROJECT_TOKEN-Secret fehlt – Board-Position für ${issue_url} nicht gesetzt (Sammel-Issue steht dann irgendwo statt oben). PAT mit project-Scope als Secret PROJECT_TOKEN hinterlegen."
              return 0
            fi
            local content_id
            content_id=$(gh issue view "$issue_url" --repo "$REPO" --json id --jq .id)
            local item_id
            item_id=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
              -f query='mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item{ id } } }' \
              -f p="$PROJECT_ID" -f c="$content_id" \
              --jq '.data.addProjectV2ItemById.item.id')
            GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
              -f query='mutation($p:ID!,$i:ID!){ updateProjectV2ItemPosition(input:{projectId:$p,itemId:$i}){ items(first:1){ nodes{ id } } } }' \
              -f p="$PROJECT_ID" -f i="$item_id" >/dev/null
            echo "Board-Position 'oben' gesetzt für ${issue_url} (item ${item_id})."
          }

          count=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" --json number --jq 'length')

          # Gibt es schon ein OFFENES Sammel-Issue? (Titel-Exakt-Match über die offenen
          # area:architektur-Issues — dasselbe robuste Muster wie forum-inbox.yml.)
          existing=$(gh issue list --repo "$REPO" --state open --label "$INBOX_LABEL" \
            --json number,title \
            --jq "[.[] | select(.title == \"$marker\")][0].number // empty")

          if [ "$count" -eq 0 ]; then
            if [ -n "$existing" ]; then
              echo "Keine offenen Dependabot-PRs mehr – schließe Sammel-Issue #$existing."
              gh issue close "$existing" --repo "$REPO" --reason completed \
                --comment "Keine offenen Dependabot-PRs mehr – automatisch geschlossen."
            else
              echo "Keine offenen Dependabot-PRs, kein Sammel-Issue nötig."
            fi
            exit 0
          fi

          list=$(gh pr list --repo "$REPO" --state open --author "app/dependabot" --json number,title,url \
            --jq '.[] | "- #\(.number) \(.title) (\(.url))"')

          if [ -n "$existing" ]; then
            echo "Bestehendes Sammel-Issue #$existing – aktualisiere PR-Liste per Kommentar."
            gh issue comment "$existing" --repo "$REPO" \
              --body "$(printf 'Aktueller Stand: %s offene Dependabot-PR(s).\n\n%s' "$count" "$list")"
          else
            echo "Lege neues Sammel-Issue an."
            body=$(printf '%s\n' \
              "Automatisch angelegt: **${count} offene Dependabot-PR(s)** warten auf Merge." \
              "" \
              "$list" \
              "" \
              "**Abarbeiten ohne Worktree/Code** (wie der Epic-Sonderfall, siehe AGENTS.md › Der Agent managt das Board): pro PR CI grün prüfen (\`gh pr checks <nr>\`) und mergen (\`gh pr merge <nr> --squash --delete-branch\`), danach dieses Issue schließen (\`gh issue close <nr> --reason completed\`).")
            new_url=$(gh issue create --repo "$REPO" \
              --title "$marker" \
              --label "$INBOX_LABEL" \
              --body "$body")
            echo "Angelegt: ${new_url}"
            # An die oberste Board-Position schieben (#747) – nur beim NEUEN Issue, nicht
            # beim Ergänzen eines bestehenden (das steht schon an seiner Board-Position).
            set_board_top "$new_url"
          fi
