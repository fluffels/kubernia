name: Interne Bezüge im PR-Text

# check:internalrefs --text (#990/#1239): PR-Titel und -Body gegen die Begriffslisten prüfen.
# Der Repo-Lauf in CI deckt Dateien und Commit-Messages ab; Titel/Body stehen nur im PR und
# bleiben über refs/pull/* dauerhaft öffentlich, auch wenn der PR später editiert wird.
#
# Hinweis: Required-Check im Ruleset „main-schutz“ (Stand 2026-10-06, #1303). Der Jobname ist ASCII
# und bleibt wortgleich: wer ihn ändert, zieht Ruleset und den Spiegel .github/ruleset-main-schutz.json
# (Quelle des Shadowing-Wächters test/harness/required-check-shadowing.test.ts, im Factory-Repo) nach.
#
# Design:
#   - Trigger inkl. `edited`, damit auch ein nachträglich geänderter Titel/Body geprüft wird.
#   - Eigener Workflow statt Schritt in ci.yml: ein Edit startet nicht die ganze Gate-Kette neu.
#   - Titel/Body kommen über Umgebungsvariablen, nie per Interpolation in das Skript.
#   - Das Skript braucht nur Node-Builtins, daher kein `npm ci`.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# Ein Edit-Lauf ersetzt den veralteten desselben PRs.
concurrency:
  group: internalrefs-pr-text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    name: PR-Text interne Bezuege pruefen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Titel und Body prüfen
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/check-internalrefs.mjs --text
