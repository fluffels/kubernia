replicaCount: 1

image:
  repository: ghcr.io/fluffels/kubernia
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: kubernia.local
  tls: []
  # Für TLS-Betrieb (z.B. via cert-manager):
  # tls:
  #   - secretName: kubernia-tls
  #     hosts:
  #       - kubernia.example.com

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
